name: Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.38. Leave blank to build only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE="true"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            IS_RELEASE="true"
            RELEASE_TAG="v${VERSION}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            IS_RELEASE="false"
            RELEASE_TAG=""
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  test:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Check Python syntax
        run: |
          python -m py_compile setup.py main.py gui.py docs.py UIMode.py

      - name: Lint critical errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run tests
        run: |
          python -m pytest tests/ -v
        if: hashFiles('tests/*.py') != ''

  build:
    needs:
      - prepare
      - test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            data_separator: ";"
          - os: macos-latest
            platform: macos
            data_separator: ":"
          - os: ubuntu-latest
            platform: linux
            data_separator: ":"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --windowed --name LogDocumentationSystem --icon assets/lds.ico --add-data "assets${{ matrix.data_separator }}assets" --add-data "docs.json${{ matrix.data_separator }}." setup.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name LogDocumentationSystem --icon assets/lds.icns --add-data "assets${{ matrix.data_separator }}assets" --add-data "docs.json${{ matrix.data_separator }}." setup.py

      - name: Register macOS file types
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import plistlib
          import shutil
          from pathlib import Path

          app = Path("dist/LogDocumentationSystem.app")
          info_path = app / "Contents" / "Info.plist"
          resources = app / "Contents" / "Resources"
          resources.mkdir(parents=True, exist_ok=True)

          icon_names = ["lds", "ldsg", "ldsd", "ldsu", "dictv2"]
          for icon_name in icon_names:
              shutil.copyfile(Path("assets") / f"{icon_name}.icns", resources / f"{icon_name}.icns")

          file_types = [
              ("lds", "LDS Log File", "com.mathewsa.lds", "lds.icns"),
              ("ldsg", "LDS General Log", "com.mathewsa.lds.ldsg", "ldsg.icns"),
              ("ldsd", "LDS Debugging Log", "com.mathewsa.lds.ldsd", "ldsd.icns"),
              ("ldsu", "LDS UI Mode File", "com.mathewsa.lds.ldsu", "ldsu.icns"),
              ("ldsdict", "LDS Dictionary File", "com.mathewsa.lds.ldsdict", "dictv2.icns"),
          ]

          with info_path.open("rb") as fh:
              plist = plistlib.load(fh)

          plist["CFBundleIdentifier"] = "com.mathewsa.log-documentation-system"
          plist["CFBundleName"] = "Log Documentation System"
          plist["CFBundleDisplayName"] = "Log Documentation System"
          plist["CFBundleIconFile"] = "lds.icns"
          plist["CFBundleDocumentTypes"] = [
              {
                  "CFBundleTypeExtensions": [extension],
                  "CFBundleTypeIconFile": icon_file,
                  "CFBundleTypeName": description,
                  "CFBundleTypeRole": "Editor",
                  "LSHandlerRank": "Owner",
                  "LSItemContentTypes": [uti],
              }
              for extension, description, uti, icon_file in file_types
          ]
          plist["UTExportedTypeDeclarations"] = [
              {
                  "UTTypeConformsTo": ["public.data"],
                  "UTTypeDescription": description,
                  "UTTypeIconFile": icon_file,
                  "UTTypeIdentifier": uti,
                  "UTTypeTagSpecification": {
                      "public.filename-extension": [extension],
                  },
              }
              for extension, description, uti, icon_file in file_types
          ]

          with info_path.open("wb") as fh:
              plistlib.dump(plist, fh, sort_keys=False)
          PY

      - name: Build Linux app
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --windowed --name LogDocumentationSystem --add-data "assets${{ matrix.data_separator }}assets" --add-data "docs.json${{ matrix.data_separator }}." setup.py

      - name: Register Linux file types
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shared-mime-info desktop-file-utils

          mkdir -p "$HOME/.local/share/applications" "$HOME/.local/share/mime/packages" "$HOME/.local/share/icons/hicolor/256x256/apps"
          cp assets/dictv2.png "$HOME/.local/share/icons/hicolor/256x256/apps/dictv2.png"
          cp assets/lds.png "$HOME/.local/share/icons/hicolor/256x256/apps/lds.png"

          cat > "$HOME/.local/share/applications/log-documentation-system.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Log Documentation System
          Exec="/usr/bin/env" python3 -m setup %F
          Icon=lds
          Terminal=false
          Categories=Utility;
          MimeType=application/x-lds;application/x-ldsg;application/x-ldsd;application/x-ldsu;application/x-ldsdict;
          DESKTOP

          desktop-file-install --dir="$HOME/.local/share/applications" "$HOME/.local/share/applications/log-documentation-system.desktop"

          cat > "$HOME/.local/share/mime/packages/lds.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <mime-info xmlns="http://www.freedesktop.org/shared-mime-info">
            <mime-type type="application/x-lds">
              <comment>LDS Log File</comment>
              <glob pattern="*.lds"/>
              <icon name="lds"/>
            </mime-type>
            <mime-type type="application/x-ldsg">
              <comment>LDS General Log</comment>
              <glob pattern="*.ldsg"/>
              <icon name="lds"/>
            </mime-type>
            <mime-type type="application/x-ldsd">
              <comment>LDS Debugging Log</comment>
              <glob pattern="*.ldsd"/>
              <icon name="lds"/>
            </mime-type>
            <mime-type type="application/x-ldsu">
              <comment>LDS UI Mode File</comment>
              <glob pattern="*.ldsu"/>
              <icon name="lds"/>
            </mime-type>
            <mime-type type="application/x-ldsdict">
              <comment>LDS Dictionary File</comment>
              <glob pattern="*.ldsdict"/>
              <icon name="dictv2"/>
            </mime-type>
          </mime-info>
          XML

          update-mime-database "$HOME/.local/share/mime"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist/dmg
          cp -R "dist/LogDocumentationSystem.app" "dist/dmg/LogDocumentationSystem.app"
          hdiutil create -volname "Log Documentation System" -srcfolder dist/dmg -ov -format UDZO "dist/log-documentation-system-${APP_VERSION}-macos.dmg"

      - name: Build Linux deb installer
        if: runner.os == 'Linux'
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PACKAGE_ROOT="dist/deb/log-documentation-system"
          INSTALL_ROOT="${PACKAGE_ROOT}/opt/log-documentation-system"
          BIN_ROOT="${PACKAGE_ROOT}/usr/local/bin"
          DESKTOP_ROOT="${PACKAGE_ROOT}/usr/share/applications"
          ICON_ROOT="${PACKAGE_ROOT}/usr/share/icons/hicolor/scalable/apps"
          PNG_ICON_ROOT="${PACKAGE_ROOT}/usr/share/icons/hicolor/1024x1024/apps"
          MIME_ROOT="${PACKAGE_ROOT}/usr/share/mime/packages"
          MIME_ICON_ROOT="${PACKAGE_ROOT}/usr/share/icons/hicolor/scalable/mimetypes"
          MIME_PNG_ICON_ROOT="${PACKAGE_ROOT}/usr/share/icons/hicolor/1024x1024/mimetypes"

          mkdir -p "${INSTALL_ROOT}" "${BIN_ROOT}" "${DESKTOP_ROOT}" "${ICON_ROOT}" "${PNG_ICON_ROOT}" "${MIME_ROOT}" "${MIME_ICON_ROOT}" "${MIME_PNG_ICON_ROOT}" "${PACKAGE_ROOT}/DEBIAN"
          cp -R dist/LogDocumentationSystem/* "${INSTALL_ROOT}/"
          cp assets/lds.svg "${ICON_ROOT}/log-documentation-system.svg"
          cp assets/lds.png "${PNG_ICON_ROOT}/log-documentation-system.png"
          cp assets/lds.svg "${MIME_ICON_ROOT}/application-x-lds.svg"
          cp assets/ldsg.svg "${MIME_ICON_ROOT}/application-x-lds-general.svg"
          cp assets/ldsd.svg "${MIME_ICON_ROOT}/application-x-lds-debugging.svg"
          cp assets/ldsu.svg "${MIME_ICON_ROOT}/application-x-lds-ui-mode.svg"
          cp assets/lds.png "${MIME_PNG_ICON_ROOT}/application-x-lds.png"
          cp assets/ldsg.png "${MIME_PNG_ICON_ROOT}/application-x-lds-general.png"
          cp assets/ldsd.png "${MIME_PNG_ICON_ROOT}/application-x-lds-debugging.png"
          cp assets/ldsu.png "${MIME_PNG_ICON_ROOT}/application-x-lds-ui-mode.png"

          cat > "${BIN_ROOT}/log-documentation-system" <<'EOF'
          #!/usr/bin/env sh
          exec /opt/log-documentation-system/LogDocumentationSystem "$@"
          EOF
          chmod +x "${BIN_ROOT}/log-documentation-system"

          cat > "${DESKTOP_ROOT}/log-documentation-system.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Log Documentation System
          Exec=/usr/local/bin/log-documentation-system %f
          Icon=log-documentation-system
          MimeType=application/x-lds;application/x-lds-general;application/x-lds-debugging;application/x-lds-ui-mode;
          Terminal=false
          Categories=Office;Utility;
          StartupWMClass=LogDocumentationSystem
          EOF

          cat > "${MIME_ROOT}/log-documentation-system.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <mime-info xmlns="http://www.freedesktop.org/standards/shared-mime-info">
            <mime-type type="application/x-lds">
              <comment>LDS Log File</comment>
              <icon name="application-x-lds"/>
              <glob pattern="*.lds"/>
            </mime-type>
            <mime-type type="application/x-lds-general">
              <comment>LDS General Log</comment>
              <icon name="application-x-lds-general"/>
              <glob pattern="*.ldsg"/>
            </mime-type>
            <mime-type type="application/x-lds-debugging">
              <comment>LDS Debugging Log</comment>
              <icon name="application-x-lds-debugging"/>
              <glob pattern="*.ldsd"/>
            </mime-type>
            <mime-type type="application/x-lds-ui-mode">
              <comment>LDS UI Mode File</comment>
              <icon name="application-x-lds-ui-mode"/>
              <glob pattern="*.ldsu"/>
            </mime-type>
          </mime-info>
          EOF

          cat > "${PACKAGE_ROOT}/DEBIAN/postinst" <<'EOF'
          #!/usr/bin/env sh
          set -e
          if command -v update-mime-database >/dev/null 2>&1; then
              update-mime-database /usr/share/mime
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF

          cat > "${PACKAGE_ROOT}/DEBIAN/postrm" <<'EOF'
          #!/usr/bin/env sh
          set -e
          if command -v update-mime-database >/dev/null 2>&1; then
              update-mime-database /usr/share/mime
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          chmod +x "${PACKAGE_ROOT}/DEBIAN/postinst" "${PACKAGE_ROOT}/DEBIAN/postrm"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: log-documentation-system
          Version: ${APP_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: mathewsa
          Description: Log Documentation System desktop application
          EOF

          dpkg-deb --build "${PACKAGE_ROOT}" "dist/log-documentation-system-${APP_VERSION}-linux-amd64.deb"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: log-documentation-system-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/Output/*.exe
            dist/log-documentation-system-*.dmg
            dist/log-documentation-system-*.deb
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets/flat
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) -exec cp {} release-assets/flat/ \;

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: Log Documentation System ${{ needs.prepare.outputs.version }}
          files: release-assets/flat/*
          generate_release_notes: true
